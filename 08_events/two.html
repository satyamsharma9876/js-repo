<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Chai Aur Code</h1>
    <button id ="stop">Stop</button>
</body>
<script>
    // setTimeout(function(){
    //     console.log("hitesh");
        
    // },2000)// lets give the reference of fn and execute it

    const sayhitesh=function(){
        console.log("Hitesh");  
    }
    setTimeout(sayhitesh,2000)
    //document.querySelector('h1').innerHTML="Best Js Series" // lets run it after 2 sec so make a fn & use SetTimeout

    const changeText = function(){
        document.querySelector('h1').innerHTML="Best Js Series"
    }
    const changeMe=setTimeout(changeText,2000)// lets also stop this event to happen so use claerTimeout
    
    document.querySelector('#stop').addEventListener('click',function(){
        clearTimeout(changeMe,2000)
        console.log("STOPPED");
    })

</script>
