<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style = "background-color: #212121;">
    0	UNSENT	Client has been created. open() not called yet.
1	OPENED	open() has been called.
2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
3	LOADING	Downloading; responseText holds partial data.
4	DONE	The operation is complete.
</body>
<script>
    const requestUrl = 'https://api.github.com/users/satyamsharma9876'
    const xhr = new XMLHttpRequest() // it is a way to send and recive data
    xhr.open('GET', requestUrl)
    xhr.onreadystatechange = function(){
         console.log(xhr.readyState);
         if(xhr.readyState === 4){
            const data = JSON.parse(this.responseText)// parse convert string to json
            console.log(typeof data)//now type of data is obj so we can get followers out of it
            console.log(data);
            
            console.log(data.followers); // but why undefined coming b/c type of data is string so convert into JSON, most of tim when data comes
            //  from url is in form of string & in some cases in form of obj

            //console.log(this.responseText); // "this" is used to refer the current context 
         }
    }
    xhr.send()// for calling the open its nt get called automatically
</script>
</html>
